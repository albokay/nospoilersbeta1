# Supabase CLI per-function config.
# Read on every `supabase functions deploy <name>`.

[functions.send-invite]
# Project is on ES256 JWT signing keys; the Edge Functions gateway runtime
# only accepts HS256 and would 401 every call with UNSUPPORTED_TOKEN_ALGORITHM.
# The function verifies the JWT itself via admin.auth.getUser(jwt), so the
# gateway check is redundant. Pinning here so future deploys don't have to
# remember --no-verify-jwt. See HANDOFF.md §"Edge function deploy notes".
verify_jwt = false

[functions.send-group-invite]
# Restructure people-group invites. Same ES256 reason as send-invite — the
# function verifies the JWT itself via admin.auth.getUser(jwt).
verify_jwt = false

[functions.send-message]
# Same reason as send-invite — function does its own JWT verification
# inside via admin.auth.getUser(jwt); gateway check is redundant and
# would 401 with the project's ES256 keys.
verify_jwt = false

[functions.send-digests]
# Not user-invoked — called by pg_cron (and manually for testing), not by a
# browser with a user JWT. Gateway JWT verification is disabled; the function
# instead gates on a shared secret (DIGEST_CRON_SECRET via x-digest-secret
# header). See HANDOFF.md §"Edge function deploy notes".
verify_jwt = false

[functions.build-browse-rows]
# Not user-invoked — called nightly by pg_cron (run_build_browse_rows) and
# manually for testing. Gates on the SAME shared secret as send-digests
# (DIGEST_CRON_SECRET via x-digest-secret) — same trust boundary, nothing new
# to provision. Rebuilds the group room's auto poster rows from TVMaze.
verify_jwt = false

[functions.refresh-shows]
# Not user-invoked — called nightly by pg_cron (run_refresh_shows) and
# manually for testing. Gates on the SAME shared secret as send-digests
# (DIGEST_CRON_SECRET via x-digest-secret). Refreshes every non-Ended show's
# episode counts from TVMaze (his Survivor catch, 2026-11-02).
verify_jwt = false

[functions.delete-account]
# Self-serve account deletion. Same ES256 reason as the others — the function
# verifies the JWT itself via admin.auth.getUser(jwt), then anonymizes via a
# user-scoped RPC and scrubs auth.users via the Admin API.
verify_jwt = false

[functions.build-show-reference]
# Spoiler-gated reference builder (2026-09-05). Same ES256 reason as
# send-invite — the function verifies the JWT itself via admin.auth.getUser.
verify_jwt = false

[functions.send-pushes]
# Push notifications (2026-11-05). CP1: the test push, invoked from the app
# with a user JWT — same ES256 reason as send-invite, so the function checks
# the JWT itself via admin.auth.getUser. CP2's timed batches will gate on the
# shared DIGEST_CRON_SECRET like send-digests.
verify_jwt = false
