<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (2026-08-18, home-screen app): lets the page paint
         under the notch / home bar when installed; the mobile pages already
         pad with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Sidebar</title>

    <!-- Home-screen app (2026-08-18): the manifest makes Share → "Add to Home
         Screen" install Sidebar as a standalone app (no browser chrome);
         Chrome/Edge offer "Install" from the same file. No service worker on
         purpose (would reintroduce stale-deploy caching). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7ABD8E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sidebar" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Link previews (2026-08-18): texted/shared links (iMessage, WhatsApp,
         Slack…) show the app icon as a compact card + this title/description.
         One card for every URL (single-page site) — per-invite previews would
         need a server piece. Absolute image URL: scrapers won't resolve
         relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sidebar" />
    <meta property="og:title" content="Sidebar" />
    <meta property="og:description" content="A place for you and your friends to talk about TV, spoiler-free." />
    <meta property="og:image" content="https://beta.sidebar.watch/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sidebar" />
    <meta name="twitter:description" content="A place for you and your friends to talk about TV, spoiler-free." />
    <meta name="twitter:image" content="https://beta.sidebar.watch/icons/icon-512.png" />
    <meta name="description" content="A place for you and your friends to talk about TV, spoiler-free." />

    <!-- Inter (body/UI) + Lora (editorial banners) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Beta gate is now handled by the React BetaGate component via server-side RPC -->
    <!-- IMPORTANT: point directly at /src/index.tsx -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
